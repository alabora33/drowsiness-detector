# Tool configuration only. The app is run from the source tree (or the Docker
# image) and is not packaged; the version lives in app/__init__.py.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: uses the real MediaPipe model and native libraries",
]
