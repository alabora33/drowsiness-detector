# Night driving profile
# Experimental configuration for earlier drowsiness warnings.

server:
  host: 0.0.0.0
  port: 8000

camera:
  max_fps: 10            # upper bound on frames the browser sends per second
  frame_width: 640       # frames are captured/resized to this size
  frame_height: 480
  jpeg_quality: 0.7      # 0.3-1.0, browser-side JPEG encoding quality

detection:
  model_path: models/face_landmarker.task
  max_faces: 2           # >1 lets us notice extra faces; the largest one is tracked
  min_face_confidence: 0.5
  ear_threshold: 0.20    # eye aspect ratio below this counts as "closed"
  min_closed_seconds: 1.2    # continuous closure before DROWSINESS_WARNING
  min_open_seconds: 0.25      # eyes must stay open this long to end a closure (filters noisy frames)
  no_face_grace_seconds: 1.0 # short face-tracking drops are ignored
  low_light_threshold: 40   # mean frame brightness (0-255) below this is reported as low light
  perclos:
    enabled: true
    window_seconds: 30   # rolling window for percentage of eye closure
    threshold: 0.3       # warn when eyes were closed >30% of the window

alerts:
  enabled: true
  sound: true            # browser plays a beep while a warning is active

logging:
  level: INFO
