name: Release

# Publishes ghcr.io/<owner>/<repo>:<version> when a semantic version tag
# (e.g. v1.2.3) is pushed. Only tags on main whose version matches
# app/__version__ are published, and only after the full CI has passed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag must match app version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app/__init__.py version $app_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
      - name: Tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

  ci:
    name: CI
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to GHCR
    needs: [verify-tag, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing version
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists; versions are immutable, bump the version instead"
            exit 1
          fi
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CONFIG_PATH=configs/default.yaml
            APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published $IMAGE:$VERSION"
            echo
            echo "Immutable reference: \`$IMAGE@$DIGEST\`"
            echo
            echo "Tags:"
            while read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
