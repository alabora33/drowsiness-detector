name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Reused by the release workflow so a version is only published after
  # exactly the same checks have passed.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libraries for MediaPipe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgles2 libegl1
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and integration tests
        run: pytest -v

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (default config)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: drowsiness-detector:ci
          build-args: |
            CONFIG_PATH=configs/default.yaml
            APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: ./scripts/container_smoke.sh drowsiness-detector:ci
      - name: Build with another config and check it is baked in
        run: |
          docker buildx build --load --cache-from type=gha \
            --build-arg CONFIG_PATH=configs/sensitive.yaml -t drowsiness-detector:ci-sensitive .
          docker run --rm drowsiness-detector:ci-sensitive \
            python -m app.config --check /app/config/config.yaml | tee check.txt
          grep -q "ear_threshold=0.21" check.txt
      - name: Invalid config must fail the build
        run: |
          if docker buildx build --cache-from type=gha \
              --build-arg CONFIG_PATH=tests/fixtures/invalid_config.yaml .; then
            echo "::error::build with an invalid config succeeded"
            exit 1
          fi
          echo "Build failed as expected."
